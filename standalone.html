        return;
      }
      printWindow.document.write(`

        <html>
          <head>
            <title>Invoice - ${order.orderId}</title>
            <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
            <style>
              @page { size: auto; margin: 12mm; }
              body { margin: 0; padding: 20px; background: #fff; font-family: 'Poppins', sans-serif; }
              @media print {
                body { padding: 0; }
                #invoice-render-area { border: none !important; box-shadow: none !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; }
              }
            </style>
          </head>
          <body>
            ${content}
            <script>
              window.onload = function() {
                setTimeout(function() {
                  window.focus();
                  window.print();
                }, 300);
              };
            <\/script>
          </body>
        </html>
      `);
      printWindow.document.close();
    };

    window.downloadPdfInvoice = function(order) {
      if (!order) return;
      const container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.left = '-9999px';
      container.style.top = '0';
      container.style.width = '720px';
      container.innerHTML = window.generateInvoiceHtml(order);
      document.body.appendChild(container);

      const opt = {
        margin: [10, 10, 10, 10],
        filename: `Invoice_${order.orderId || 'Receipt'}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      if (window.html2pdf) {
        window.html2pdf().from(container).set(opt).save().then(() => {
          document.body.removeChild(container);
        }).catch(() => {
          document.body.removeChild(container);
          window.printInvoice(order);
        });
      } else {
        document.body.removeChild(container);
        window.printInvoice(order);
      }
    };

    const ShopContext = createContext();

    const assignInitialStock = (productsList) => {
      return productsList.map((p, idx) => {
        let stock = 12;
        const mod = idx % 11;
        if (mod === 0) stock = 3; // 🚨 Low Stock: 3 pairs
        else if (mod === 1) stock = 5; // 🚨 Low Stock: 5 pairs
        else if (mod === 4) stock = 2; // 🚨 Low Stock: 2 pairs
        else if (mod === 7) stock = 4; // 🚨 Low Stock: 4 pairs
        else if (mod === 10) stock = 1; // 🚨 Critical: 1 pair
        else if (idx % 29 === 0) stock = 0; // ❌ Out of stock
        else if (idx % 3 === 0) stock = 8;
        else if (idx % 5 === 0) stock = 15;
        else if (idx % 7 === 0) stock = 22;
        else stock = 10 + (idx % 14);

        if (p.subcategory === 'Kheri') {
          if (idx % 3 === 0) stock = 3; // 3 pairs of Kheri
          else if (idx % 2 === 0) stock = 5; // 5 pairs of Kheri
          else stock = 10;
        }
        if (p.subcategory === 'Ladies Bags') {
          if (idx % 3 === 0) stock = 4; // 4 Handbags
          else if (idx % 2 === 0) stock = 5; // 5 Handbags
          else stock = 12;
        }

        const effectiveStock = (p.stockCount !== undefined && p.stockCount !== null) ? p.stockCount : stock;
        return {
          ...p,
          stockCount: effectiveStock,
          inStock: effectiveStock > 0
        };
      });
    };

    const ShopProvider = ({ children }) => {
      const [products, setProducts] = useState(() => {
        try {

          return assignInitialStock(DEFAULT_PRODUCTS);
        } catch {
          return assignInitialStock(DEFAULT_PRODUCTS);
        }
      });

        try {

          }
        } catch (e) {}
        return [

        try {

          if (e.key === 'stylish_orders_v20' && e.newValue) {

            } catch (err) {}
          }

          }

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const addToCart = (product, color = null, size = null, qty = 1) => {
        const selColor = color || (product.colors && product.colors[0]) || 'Standard';
        const selSize = size || (product.sizes && product.sizes[0]) || 'Standard';

        setCart((prev) => {
          const idx = prev.findIndex(item => item.product.id === product.id && item.selectedColor === selColor && item.selectedSize === selSize);
          if (idx > -1) {
            const updated = [...prev];
            updated[idx].quantity += qty;
            return updated;
          }
          return [...prev, { product, selectedColor: selColor, selectedSize: selSize, quantity: qty }];
        });
        showToast(`Added "${product.title}" to Cart`);
      };

      const updateCartQuantity = (id, color, size, delta) => {
        setCart(prev => prev.map(item => {
          if (item.product.id === id && item.selectedColor === color && item.selectedSize === size) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (id, color, size) => {
        setCart(prev => prev.filter(item => !(item.product.id === id && item.selectedColor === color && item.selectedSize === size)));

        setProducts(prev => prev.map(p => {
          if (p.id === id) {
            const updated = Math.max(0, (p.stockCount || 0) + amount);
            return { ...p, stockCount: updated, inStock: updated > 0 };

          if (p.id === id) {

            return { ...p, stockCount: s, inStock: s > 0 };
          }
          return p;
        }));
      };

        setOrders(prev => {
          const target = prev.find(o => o.orderId === orderId);
          if (target && target.customer && target.customer.phone) {
            const rawPhone = target.customer.phone.replace(/[^0-9]/g, '');
            const formattedPhone = rawPhone.startsWith('0') ? '92' + rawPhone.slice(1) : rawPhone;
            const msg = `Assalam-o-Alaikum ${target.customer.fullName}!\n\nYour order *${orderId}* status has been updated to: *${newStatus.toUpperCase()}*.\n\nThank you for shopping with *Stylish Shoes & Bags*! Step Into Style.`;
            const waUrl = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(msg)}`;
            try { window.open(waUrl, '_blank'); } catch (e) {}
          }
          return prev.map(o => o.orderId === orderId ? { ...o, status: newStatus } : o);
        });
        showToast(`⚡ Order ${orderId} status set to ${newStatus} & sent to WhatsApp!`);

    // --- CHECKOUT WITH WHATSAPP ALERT ---
    const CheckoutModal = () => {
      const { isCheckoutOpen, setIsCheckoutOpen, cart, cartSubtotal, shippingFee, cartTotal, addOrder, clearCart, orderReceipt, setOrderReceipt, showToast } = useShop();
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [city, setCity] = useState('Lahore');
      const [paymentMethod, setPaymentMethod] = useState('cod');

      if (!isCheckoutOpen && !orderReceipt) return null;

      const handleConfirmOrder = (e) => {
        e.preventDefault();
        if (!fullName || !phone || !address) return;

        const generatedOrderId = `STYL-${Math.floor(100000+Math.random()*900000)}`;
        const orderDate = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        const orderObj = {
          orderId: generatedOrderId,
          date: orderDate,
          customer: { fullName, phone, address, city },
          items: [...cart],
          paymentMethod,
          subtotal: cartSubtotal,
          shippingFee: shippingFee,
          total: cartTotal,
          status: 'Pending'
        };

        let msg = `🛍️ *NEW ORDER RECEIVED - STYLISH SHOES & BAGS*\n\n`;
        msg += `🆔 *Order ID:* ${generatedOrderId}\n`;
        msg += `📅 *Date:* ${orderDate}\n`;
        msg += `👤 *Customer Name:* ${fullName}\n`;
        msg += `📞 *Phone Number:* ${phone}\n`;
        msg += `📍 *Delivery Address:* ${address}, ${city}\n`;
        msg += `💳 *Payment Method:* ${paymentMethod.toUpperCase()}\n\n`;
        msg += `📦 *ORDERED ITEMS (${cart.reduce((a,b)=>a+b.quantity, 0)}):*\n`;

        cart.forEach((item, idx) => {
          msg += `${idx + 1}. *${item.product.title}*\n   Size: ${item.selectedSize||'N/A'} | Color: ${item.selectedColor||'Standard'} | Qty: ${item.quantity} - Rs. ${(item.product.price * item.quantity).toLocaleString()}\n`;
        });

        msg += `\n💰 *Subtotal:* Rs. ${cartSubtotal.toLocaleString()}\n`;
        msg += `🚚 *Shipping Fee:* ${shippingFee === 0 ? 'FREE' : `Rs. ${shippingFee}`}\n`;
        msg += `💵 *TOTAL PAYABLE:* Rs. ${cartTotal.toLocaleString()}\n\n`;
        msg += `Thank you for shopping with Stylish Shoes & Bags! Step Into Style.`;

        const waUrl = `https://wa.me/923255964412?text=${encodeURIComponent(msg)}`;

        addOrder(orderObj);
        setOrderReceipt({ ...orderObj, whatsappUrl: waUrl, rawMsg: msg });
        clearCart();

        if (showToast) showToast(`🎉 Order ${generatedOrderId} Confirmed!`);

        try {
          window.open(waUrl, '_blank');
        } catch(err) {}
      };

      if (orderReceipt) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 animate-fadeIn font-poppins">
            <div className="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full space-y-4 shadow-2xl border border-pink-100 max-h-[90vh] overflow-y-auto">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-emerald-600 text-2xl font-bold">✓</div>
                <h3 className="text-2xl font-extrabold uppercase text-neutral-900">ORDER CONFIRMED!</h3>
                <p className="text-xs text-gray-500">Order ID: <strong className="text-pink-600">{orderReceipt.orderId}</strong> &bull; {orderReceipt.date}</p>
              </div>

              <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs text-emerald-800 font-medium">
                🚀 <strong>WhatsApp Order Alert Sent!</strong> Details sent to WhatsApp: <strong>03255964412</strong>.
              </div>

              <div className="bg-pink-50/60 p-4 rounded-xl text-xs space-y-1.5 border border-pink-100">
                <div className="font-bold text-neutral-900 border-b pb-1 text-[11px] uppercase">Customer Details</div>
                <div className="flex justify-between"><span>Customer:</span><span className="font-bold">{orderReceipt.customer.fullName}</span></div>
                <div className="flex justify-between"><span>Phone:</span><span className="font-bold">{orderReceipt.customer.phone}</span></div>
                <div className="flex justify-between"><span>Address:</span><span className="font-bold">{orderReceipt.customer.address}, {orderReceipt.customer.city}</span></div>
              </div>

              <div className="bg-gray-50 p-4 rounded-xl text-xs space-y-2 border border-gray-200">
                <div className="font-bold text-gray-900 border-b pb-1 text-[11px] uppercase">Ordered Items ({orderReceipt.items ? orderReceipt.items.reduce((a,b)=>a+b.quantity,0) : 0})</div>
                <div className="space-y-2 max-h-40 overflow-y-auto">
                  {orderReceipt.items && orderReceipt.items.map((item, i) => (
                    <div key={i} className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-purple-100 gap-3 shadow-xs">
                      <div className="flex items-center gap-3">
                        <img
                          src={item.product?.image}
                          alt={item.product?.title || 'Product'}
                          className="w-12 h-12 object-cover rounded-lg border border-purple-100 shrink-0"
                          onError={(e) => { e.target.src = 'logo.png'; }}
                        />
                        <div>
                          <div className="font-extrabold text-gray-900 text-xs line-clamp-1">{item.product ? item.product.title : 'Item'}</div>
                          <div className="text-[10px] text-gray-500">Size: {item.selectedSize} | Color: {item.selectedColor} | Qty: {item.quantity}</div>
                        </div>
                      </div>
                      <div className="font-black text-purple-950 text-xs shrink-0">Rs. {(item.product ? item.product.price * item.quantity : 0).toLocaleString()}</div>
                    </div>
                  ))}
                </div>
                <div className="border-t pt-2 space-y-1">
                  <div className="flex justify-between text-gray-600"><span>Subtotal:</span><span>Rs. {orderReceipt.subtotal ? orderReceipt.subtotal.toLocaleString() : orderReceipt.total.toLocaleString()}</span></div>
                  <div className="flex justify-between font-extrabold text-neutral-900 text-sm border-t pt-1"><span>TOTAL PAYABLE:</span><span className="text-pink-600">Rs. {orderReceipt.total.toLocaleString()}</span></div>
                </div>
              </div>

              <div className="space-y-2.5">
                {/* 🖨️ Print & PDF Download Buttons */}
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => window.printInvoice(orderReceipt)}
                    className="w-full bg-purple-950 hover:bg-purple-900 text-white py-3 rounded-xl text-xs font-black uppercase tracking-wider shadow flex items-center justify-center gap-1.5 transition-all"
                  >
                    <span>🖨️ Print Receipt</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => window.downloadPdfInvoice(orderReceipt)}
                    className="w-full bg-fuchsia-700 hover:bg-fuchsia-800 text-white py-3 rounded-xl text-xs font-black uppercase tracking-wider shadow flex items-center justify-center gap-1.5 transition-all"
                  >
                    <span>📄 Download PDF</span>
                  </button>
                </div>

                <a href={orderReceipt.whatsappUrl} target="_blank" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-xs font-bold uppercase shadow flex items-center justify-center gap-2">
                  <span>Open WhatsApp / Resend Message</span>

              </div>
            </div>
          </div>
        );

            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold uppercase text-neutral-900">Stylish Shoes Checkout</h3>
              <button onClick={() => setIsCheckoutOpen(false)}>✕</button>
            </div>
            <form onSubmit={handleConfirmOrder} className="space-y-3 text-xs">
              <input placeholder="Full Name *" required value={fullName} onChange={e=>setFullName(e.target.value)} className="w-full p-2.5 border rounded" />
              <input placeholder="WhatsApp Phone Number *" required value={phone} onChange={e=>setPhone(e.target.value)} className="w-full p-2.5 border rounded" />
              <input placeholder="Complete Shipping Address *" required value={address} onChange={e=>setAddress(e.target.value)} className="w-full p-2.5 border rounded" />
              <div className="bg-pink-50/60 p-3 rounded text-xs font-bold flex justify-between text-neutral-900 border border-pink-100">
                <span>Total Payable (COD):</span>
                <span>Rs. {cartTotal.toLocaleString()}</span>
              </div>
              <button
                type="submit"
                className="w-full bg-neutral-950 hover:bg-pink-600 text-white py-3 rounded font-bold uppercase tracking-wider shadow"
              >
                Confirm Order &amp; Send WhatsApp Alert (03255964412)
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- QUICK VIEW & OTHER MODALS ---
    const QuickViewModal = () => {
      const { quickViewProduct, setQuickViewProduct, addToCart, setIsSizeGuideOpen } = useShop();
      const [selectedSize, setSelectedSize] = useState('');
      const [selectedColor, setSelectedColor] = useState('');
      const [activeImage, setActiveImage] = useState('');

      useEffect(() => {
        if (quickViewProduct) {
          const defaultColor = quickViewProduct.colors ? quickViewProduct.colors[0] : '';
          setSelectedSize(quickViewProduct.sizes ? quickViewProduct.sizes[0] : '');
          setSelectedColor(defaultColor);
          if (quickViewProduct.colorImages && defaultColor && quickViewProduct.colorImages[defaultColor]) {
            setActiveImage(quickViewProduct.colorImages[defaultColor]);
          } else {
            setActiveImage(quickViewProduct.image);
          }
        }
      }, [quickViewProduct]);

      if (!quickViewProduct) return null;

      const handleColorSelect = (c) => {
        setSelectedColor(c);
        if (quickViewProduct?.colorImages && quickViewProduct.colorImages[c]) {
          setActiveImage(quickViewProduct.colorImages[c]);
        } else if (quickViewProduct?.gallery && quickViewProduct.colors) {
          const colorIndex = quickViewProduct.colors.indexOf(c);
          if (colorIndex >= 0 && quickViewProduct.gallery[colorIndex]) {
            setActiveImage(quickViewProduct.gallery[colorIndex]);
          }
        }
      };

      const handleAdd = () => {
        addToCart(quickViewProduct, selectedColor, selectedSize);
        setQuickViewProduct(null);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 animate-fadeIn font-poppins">
          <div className="bg-white rounded-2xl max-w-2xl w-full p-6 relative space-y-4 shadow-2xl border border-pink-100">
            <button onClick={() => setQuickViewProduct(null)} className="absolute top-4 right-4 text-gray-400 hover:text-neutral-900 font-bold text-lg">✕</button>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div className="space-y-3">
                <img src={activeImage || quickViewProduct.image} className="w-full aspect-square object-cover rounded-xl border border-gray-100 bg-gray-50 shadow-inner" onError={(e) => {
                    if (e.target.dataset.triedFallback) return;
                    e.target.dataset.triedFallback = 'true';
                    e.target.src = getProductFallback(quickViewProduct);
                  }} />
                {(() => {
                  const imageList = quickViewProduct.gallery && quickViewProduct.gallery.length > 0
                    ? quickViewProduct.gallery
                    : [quickViewProduct.image, quickViewProduct.secondaryImage].filter(Boolean);
                  if (imageList.length <= 1) return null;
                  return (
                    <div className="flex gap-2 overflow-x-auto pb-1">
                      {imageList.map((img, idx) => (
                        <button key={idx} type="button" onClick={() => setActiveImage(img)} className={`w-12 h-12 rounded-lg overflow-hidden border-2 flex-shrink-0 transition-all ${activeImage === img ? 'border-pink-600 scale-105 shadow' : 'border-gray-200 opacity-60 hover:opacity-100'}`}>
                          <img src={img} className="w-full h-full object-cover" />
                        </button>
                      ))}
                    </div>
                  );
                })()}
              </div>
              <div className="space-y-4 text-xs">
                <div>
                  <span className="text-[10px] font-bold text-pink-600 uppercase tracking-widest">{quickViewProduct.subcategory || quickViewProduct.category}</span>
                  <h3 className="text-xl font-extrabold uppercase text-neutral-900 mt-0.5">{quickViewProduct.title}</h3>
                  <div className="text-xl font-extrabold text-neutral-900 font-poppins mt-1">Rs. {quickViewProduct.price.toLocaleString()}</div>
                </div>

                <p className="text-gray-600 text-xs leading-relaxed">{quickViewProduct.description}</p>

                {/* Color Selector */}
                {quickViewProduct.colors && (
                  <div className="space-y-1.5">
                    <label className="block text-xs font-bold text-neutral-900 uppercase">Color: <span className="text-pink-600">{selectedColor}</span></label>
                    <div className="flex flex-wrap gap-1.5">
                      {quickViewProduct.colors.map(c => (
                        <button key={c} type="button" onClick={() => handleColorSelect(c)} className={`px-2.5 py-1 rounded text-[11px] font-bold uppercase transition-all ${selectedColor === c ? 'bg-pink-600 text-white shadow-sm' : 'bg-gray-100 text-gray-700 hover:bg-pink-50'}`}>{c}</button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Size Selector */}
                {quickViewProduct.sizes && (
                  <div className="space-y-1.5">

    const MarqueeTicker = () => (

        <style>{`
          @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }

          <div className="flex items-center gap-2"><span>🛡️</span> <span>7 Days Easy Exchange</span></div>
          <div className="flex items-center gap-2"><span>💳</span> <span>Baadmay 3 Installments</span></div>
          <div className="flex items-center gap-2"><span>💵</span> <span>Cash On Delivery</span></div>

          <div className="flex items-center gap-2"><span>🛍️</span> <span>Stylish Shoes &amp; Bags</span></div>
          {/* Duplicate set for smooth infinite loop */}
          <div className="flex items-center gap-2 ml-12"><span>🚚</span> <span>Nationwide Delivery</span></div>
          <div className="flex items-center gap-2"><span>🛡️</span> <span>7 Days Easy Exchange</span></div>
          <div className="flex items-center gap-2"><span>💳</span> <span>Baadmay 3 Installments</span></div>
          <div className="flex items-center gap-2"><span>💵</span> <span>Cash On Delivery</span></div>
          <div className="flex items-center gap-2"><span>⭐</span> <span>100% Genuine Leather</span></div>
          <div className="flex items-center gap-2"><span>🛍️</span> <span>Stylish Shoes &amp; Bags</span></div>
        </div>
      </div>
    );

    const MainLayout = () => {
      const { isAdminMode } = useShop();
      if (isAdminMode) {
        return <AdminPanel />;
      }
      return (
        <div className="min-h-screen flex flex-col justify-between bg-white">
          <div>
            <Header />
            <HeroBanner />
            <MarqueeTicker />
            <CircularCategorySlider />
            <ProductGrid />
          </div>
          <Footer />
          <QuickViewModal />
          <CartDrawer />
          <CheckoutModal />
          <SizeGuideModal />
          <Toast />
          <WhatsAppFloatingButton />
        </div>
      );
    };

    const App = () => (
      <ShopProvider>
        <MainLayout />
      </ShopProvider>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
